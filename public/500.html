<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAF9]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="500 — Server Error | Daylign" />
  <title>500 — Server Error | Daylign</title>

  <!-- High-Resolution Browser-Theme-Adaptive Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/light/favicon-32x32.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/light/favicon-16x16.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/dark/favicon-32x32.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/dark/favicon-16x16.png" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/light/apple-touch-icon.png" />
  <link id="app-favicon" rel="icon" type="image/png" sizes="32x32" href="./assets/light/favicon-32x32.png" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />

  <!-- Immediate dark mode & browser-favicon sync -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('daylign-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
      function updateFavicon() {
        const browserDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const favicon = document.getElementById('app-favicon');
        if (favicon) favicon.href = browserDark ? './assets/dark/favicon-32x32.png' : './assets/light/favicon-32x32.png';
      }
      updateFavicon();
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: { DEFAULT: '#FAFAF9', dark: '#0B0F19' },
            surface: { DEFAULT: '#FFFFFF', dark: '#131B2E' },
            lavender: { DEFAULT: '#818CF8', bg: '#E0E7FF', accent: '#818CF8' },
            butter: { DEFAULT: '#FBBF24', bg: '#FEF3C7', accent: '#FBBF24' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    html.dark body { background-color: #0B0F19; color: #F1F5F9; }
  </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-6 text-slate-800 dark:text-slate-200 font-sans antialiased bg-[#FAFAF9] dark:bg-[#0B0F19] selection:bg-lavender-bg selection:text-indigo-900 transition-colors">

  <!-- 500 Card Container -->
  <main class="w-full max-w-md bg-white dark:bg-[#131B2E] p-8 sm:p-10 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm text-center relative overflow-hidden">
    
    <!-- Decorative Glows -->
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-butter-bg dark:bg-amber-950/40 rounded-full blur-2xl opacity-60 pointer-events-none" aria-hidden="true"></div>
    <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-lavender-bg dark:bg-indigo-950/40 rounded-full blur-2xl opacity-60 pointer-events-none" aria-hidden="true"></div>

    <!-- Badge -->
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-butter-bg dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 text-xs font-semibold mb-6">
      <span class="w-2 h-2 rounded-full bg-butter-accent animate-pulse" aria-hidden="true"></span>
      Error 500
    </div>

    <!-- Illustration -->
    <div class="relative mb-6">
      <h1 class="text-7xl sm:text-8xl font-black text-slate-100 dark:text-slate-800/50 tracking-tighter select-none">
        500
      </h1>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-16 h-16 rounded-2xl bg-butter-bg dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center shadow-sm border border-amber-100 dark:border-amber-900/40">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- What happened -->
    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-slate-100 tracking-tight mb-2">
      Something Went Wrong
    </h2>

    <!-- Why it happened -->
    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">
      Our server encountered an unexpected error processing your request. This is usually temporary and not caused by anything you did.
    </p>

    <!-- What to do next -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button onclick="window.location.reload()" class="flex-1 px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-900 dark:bg-indigo-600 dark:hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm transition-all flex items-center justify-center gap-2 focus:ring-2 focus:ring-slate-800 dark:focus:ring-indigo-500 cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Try Again
      </button>
      <a href="/#/" class="px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-semibold transition-colors flex items-center justify-center">
        Return to Home
      </a>
    </div>

  </main>

  <footer class="mt-8 text-center text-xs text-slate-400 dark:text-slate-500">
    Daylign &copy; 2026 — Personal Habit & Activity Alignment
  </footer>

</body>
</html>
