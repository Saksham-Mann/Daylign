<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAF9]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="404 — Page Not Found | Daylign" />
  <title>404 — Page Not Found | Daylign</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E0E7FF'/%3E%3Cpath d='M10 16l4 4 8-8' stroke='%23818CF8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FAFAF9',
            surface: '#FFFFFF',
            lavender: {
              DEFAULT: '#818CF8',
              bg: '#E0E7FF',
              accent: '#818CF8',
              hover: '#6366F1'
            },
            mint: {
              DEFAULT: '#34D399',
              bg: '#D1FAE5',
              accent: '#34D399'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>
<body class="h-full flex flex-col items-center justify-center p-6 text-slate-800 font-sans antialiased bg-canvas selection:bg-lavender-bg selection:text-indigo-900">

  <!-- 404 Card Container -->
  <main class="w-full max-w-md bg-surface p-8 sm:p-10 rounded-3xl border border-slate-100 shadow-sm text-center relative overflow-hidden">
    
    <!-- Top Decorative Glow -->
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-lavender-bg rounded-full blur-2xl opacity-60 pointer-events-none" aria-hidden="true"></div>
    <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-mint-bg rounded-full blur-2xl opacity-60 pointer-events-none" aria-hidden="true"></div>

    <!-- Badge -->
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-lavender-bg text-indigo-600 text-xs font-semibold mb-6">
      <span class="w-2 h-2 rounded-full bg-lavender-accent animate-pulse" aria-hidden="true"></span>
      Error 404
    </div>

    <!-- Illustration / Numeric Accent -->
    <div class="relative mb-6">
      <h1 class="text-7xl sm:text-8xl font-black text-slate-100 tracking-tighter select-none">
        404
      </h1>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-16 h-16 rounded-2xl bg-lavender-bg text-indigo-600 flex items-center justify-center shadow-sm border border-indigo-100">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Heading & Description -->
    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight mb-2">
      Page Not Found
    </h2>
    <p class="text-xs sm:text-sm text-slate-500 mb-8 leading-relaxed">
      The resource you're looking for doesn't exist, has been moved, or the link is expired.
    </p>

    <!-- Action Navigation Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/#/" class="flex-1 px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold shadow-sm transition-all flex items-center justify-center gap-2 focus:ring-2 focus:ring-slate-800">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Return to Home
      </a>
      <a href="/#/login" class="px-5 py-3 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-semibold transition-colors flex items-center justify-center">
        Sign In
      </a>
    </div>

  </main>

  <footer class="mt-8 text-center text-xs text-slate-400">
    Daylign &copy; 2026 — Personal Habit & Activity Alignment
  </footer>

</body>
</html>
